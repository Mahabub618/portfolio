server:
  port: ${PORT:8080}

spring:
  application:
    name: portfolio-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${DATABASE_USER:portfolio}
    password: ${DATABASE_PASSWORD:portfolio}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl-minutes: ${JWT_TTL_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  storage:
    driver: ${STORAGE_DRIVER:local}          # local | cloudinary
    max-upload-bytes: ${MAX_UPLOAD_BYTES:5242880}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
    local-dir: ${UPLOAD_DIR:./uploads}
    cloudinary-url: ${CLOUDINARY_URL:}       # cloudinary://key:secret@cloud-name
    cloudinary-folder: ${CLOUDINARY_FOLDER:portfolio}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  seed:
    sample-data: ${SEED_SAMPLE_DATA:true}
  email:
    resend-api-key: ${RESEND_API_KEY:}
    from: ${EMAIL_FROM:Portfolio <onboarding@resend.dev>}
    frontend-url: ${FRONTEND_URL:http://localhost:4200}
    token-ttl-minutes: ${RESET_TOKEN_TTL_MINUTES:15}
    rate-limit-window-minutes: ${RESET_RATE_WINDOW_MINUTES:10}
    rate-limit-max: ${RESET_RATE_MAX:3}
